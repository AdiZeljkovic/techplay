# ============================================
# PRODUCTION FRONTEND (techplay.gg)
# ============================================
# Next, as a named upstream with failure marking switched off.
#
# Why this exists: `/_next/image` fetches remote CDN artwork (MobyGames, Steam)
# and optimises it. When one of those hosts is slow, the request holds a
# connection until `proxy_read_timeout`, nginx counts it as an upstream failure,
# and after `max_fails` it marks the server dead — for *every* location, not
# just the slow one. So a sluggish third-party image CDN took the whole of
# techplay.gg to 502 while Next itself was answering /news in 160 ms.
#
# `max_fails=0` says: never conclude this server is dead. There is only one
# backend; marking it down cannot route around anything, it can only turn a slow
# request into a site-wide outage.
upstream techplay_next {
    server 127.0.0.1:3000 max_fails=0;
    keepalive 32;
}

server {
    server_name techplay.gg www.techplay.gg;
    include snippets/cloudflare-real-ip.conf;

    # Redirect www to non-www
    if ($host = www.techplay.gg) {
        return 301 https://techplay.gg$request_uri;
    }

    # Robots.txt from backend (MORA BITI OVDJE, PRIJE location /)
    location = /robots.txt {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemaps from backend
    #
    # These carry no Cache-Control of their own — they are static files in
    # public/, served by FrankenPHP before Laravel is reached, so the headers
    # the route would have set never happen. Cloudflare treats .xml as
    # cacheable by default and, given nothing to respect, holds it for hours;
    # a regenerated sitemap then sits behind a stale copy with no way to tell.
    # Five minutes is short enough that `sitemap:generate` is visible almost at
    # once, and long enough that a crawler pulling 166,000 URLs is not
    # re-rendering anything.
    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300" always;
    }

    # The catalogue hub itself, uncached and exact-match.
    #
    # nginx answers /games with a 301 to /games/ as soon as a prefix location
    # ending in a slash exists — which would have sent the hub through a
    # redirect it never used to need, and on to a URL Next then bounces back.
    # An exact-match location outranks the prefix one and keeps /games exactly
    # where it was. It needs no cache of its own: the hub is ISR in Next with a
    # five-minute window.
    location = /games {
        proxy_pass http://techplay_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Cached game pages ───────────────────────────────────────────────────
    #
    # /games/[slug] is force-dynamic in Next deliberately: 114,000 slugs
    # written to disk as ISR files is a file count nobody wants to manage, and
    # the comment in that file says the CDN was meant to do the caching
    # instead. It never did — Next sends "no-store", Cloudflare obeyed it, and
    # every one of those pages was rendered from scratch on every request,
    # crawler included. Measured 17 Aug 2026: cf-cache-status BYPASS.
    #
    # nginx caches them here, under a 4 GB ceiling with LRU eviction, so the
    # store cannot grow with the catalogue the way an ISR directory would.
    # proxy_cache_lock collapses a rush on the same URL into a single render;
    # background update means a reader never waits for a refresh.
    #
    # Safe to share between visitors: auth on this site lives in localStorage,
    # so the server never knows who is asking and every response is already
    # anonymous. Verified — no Set-Cookie on any /games/ response. It is
    # hidden regardless, so a future one cannot reach the wrong person.
    location ^~ /games/ {
        proxy_pass http://techplay_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache techplay;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 410 10m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # The page says no-store because it is rendered fresh every time, which
        # is the thing being fixed here — so its opinion is overridden.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        # A request carrying credentials skips the shared store rather than
        # filling it, even though today it would render identically.
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Frontend (Next.js - Port 3000)
    location / {
        proxy_pass http://techplay_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js revalidation endpoint (MUST be BEFORE location /api)
    location /api/revalidate {
        proxy_pass http://techplay_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API Endpoints
    location /api {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin Panel
    location /admin {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Laravel Storage
    location /storage {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Livewire (Filament)
    location /livewire {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Sanctum (Auth)
    location /sanctum {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/techplay.gg/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/techplay.gg/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    listen 80;
    server_name techplay.gg www.techplay.gg;

    if ($host = www.techplay.gg) {
        return 301 https://techplay.gg$request_uri;
    }

    if ($host = techplay.gg) {
        return 301 https://techplay.gg$request_uri;
    }

    return 301 https://techplay.gg$request_uri;
}
