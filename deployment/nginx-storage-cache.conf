# Serve uploaded files from disk, not through PHP.
#
# Paste this INSIDE the `server { server_name api-beta.techplay.gg; ... }`
# block, ABOVE the existing `location / { proxy_pass ... }`.
#
# Two problems, one block.
#
# The live config proxies everything to 127.0.0.1:8000, so every image on the
# site occupies one of eight Octane workers for as long as it takes to read a
# file off disk and write it back out. Nothing in that path needs PHP.
#
# And because Laravel serves them, no Cache-Control ever goes out. Cloudflare
# then applies its own default — 4 hours — to files whose names are ULIDs and
# can never change. That is the 893 KiB Lighthouse reports under "use efficient
# cache lifetimes", re-downloaded by every returning visitor twice a day.
#
# The fallback to @app matters: a path under /storage/ that is not a file on
# disk still reaches Laravel, so anything served dynamically keeps working.

location /storage/ {
    alias /var/www/techplay/backend/storage/app/public/;

    # ULID filenames. A given URL is one specific file, for good.
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # These are already compressed formats; gzipping them costs CPU and saves
    # nothing. SVG and JSON are the exceptions and are handled by the global
    # gzip_types.
    gzip_static off;

    access_log off;

    try_files $uri @app;
}

location @app {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
