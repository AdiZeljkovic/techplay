# Networks that scrape the catalogue, dropped at the edge of our own edge.
#
# 21 Aug 2026: 274,930 requests in one day — 32% of everything the server
# answered — from 1,660 addresses inside 43.160.0.0/12, the whole of which is
# allocated to ACEVILLE PTE. LTD., 16 Collyer Quay, Singapore (AS132203,
# Tencent Cloud's Singapore arm). They walked /games, /studios and /forum with
# Chrome user-agents rotating across five versions in near-equal volumes, and
# they executed JavaScript — the requests carried Next.js `?_rsc=` prefetches
# and hit our own client-side error reporting — so Analytics counted them as
# sixteen thousand readers and AdSense served them ads. Average engagement in
# GA4 that day: one second.
#
# They ramped first: 8 requests on 14 Aug, 189 on the 18th, ~550 on the 20th,
# then 274,944. Of 276,099 requests from that range in total, 5 were POSTs and
# the rest GETs. Nothing there has ever behaved like a reader.
#
# This is the backstop, not the fix. The fix is a Cloudflare WAF rule on
# ASN 132203, which stops the traffic before it costs us bandwidth; the API
# token on this box is scoped to Zone:Read and cache purge and cannot write
# firewall rules. Until that rule exists, this is what we have.
#
# `geo` reads $remote_addr, and the realip module has already replaced it with
# CF-Connecting-IP by the time this is evaluated — so the address matched here
# is the true visitor, not Cloudflare's proxy.
geo $tp_blocked_net {
    default 0;

    # ACEVILLE PTE. LTD. / Tencent Cloud Singapore — 43.160.0.0 - 43.175.255.255
    43.160.0.0/12 1;

# 8 Sep 2026: a second swarm, and a different animal.
#
# 289,284 requests in one day - 66.6% of everything the server answered - from
# 3,945 addresses, walking /games/<slug> (238,481) and /studios/<slug> (49,893).
# That is 99.6% of everything they asked for: they are copying the catalogue,
# one row at a time. 6.27 GB in a day, and every response a 200.
#
# It began at 02:00 and then held about 14,000 requests an hour, flat, until
# midnight. That is a rate limiter, not a person. robots.txt was fetched once
# in 289,284 requests.
#
# Unlike the Aceville swarm above, this one does not execute JavaScript: across
# a full week, not one of the networks below requested a single .js or .css
# file. So it never reached Analytics and never saw an ad. It is pure cost.
#
# The user-agents rotate across Chrome 121-125 in near-equal volumes, which is
# a pool rather than a fleet of browsers. Two obvious rules were rejected:
# blocking that string would have hit real readers, who are on Chrome 128-148;
# a per-network rate limit would have hit Applebot, which sent 20,995 requests
# from 17.166 the same day.
#
# There is a cleaner signal, and it was measured: a user-agent claiming Chrome
# while sending no sec-ch-ua header, which every real Chrome and Edge has sent
# since 2021. In a 90-second sample it separated them exactly - 430 scraper
# requests without it, 10 real readers with it.
#
# It is deliberately not used here. Googlebot's own user-agent also contains
# "Chrome/", and a rule that can be wrong about Googlebot is not worth being
# right about a scraper. A network list can be read and checked by anyone; a
# behavioural rule has to be trusted.
#
# Every network below was tested against a full week of logs before it was
# listed: not one requested a .js or .css file, so no reader has ever loaded a
# page from any of them. None belongs to Google, Microsoft, Apple, Cloudflare,
# Amazon, Akamai or Fastly - checked by whois, and worth re-checking rather
# than trusting this sentence. Note that 185.214 is "Cloudfire", an unrelated
# company; do not misread it as Cloudflare.
#
# With 2a02:c207::/32 (Netcup, 87,832 requests) this covers 99.5% of the swarm.
# The remainder is a long tail across roughly 11,000 /24s, not worth listing.
#
# If Googlebot's crawl volume ever drops after a change to this file, this file
# is the first thing to look at. The baseline on 8 Sep 2026 was 554 pages/day.
    80.241.0.0/16      1;   #  43967 req
    178.238.0.0/16     1;   #  24337 req
