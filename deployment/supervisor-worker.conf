; TechPlay queue workers.
;
; Two, because they carry two different kinds of work.
;
; `default` holds the heavy jobs: EnrichSteamBatch occupies a worker for most of
; every minute all day (twenty-five products, one and a half seconds apart), a
; library sync runs two to five minutes, the publish fan-out walks every tracker
; of a game. `live` holds broadcasts — a few hundred bytes posted to Reverb on
; localhost, done in milliseconds.
;
; Sharing one process meant a chat message dispatched behind a library sync
; arrived when the sync finished. Priority ordering on a single worker would not
; have fixed that: the running job still has to end before the next is picked,
; whichever queue it came from. Two processes is what actually separates them.
;
; Deploy: copy to /etc/supervisor/conf.d/techplay-worker.conf, then
;   supervisorctl reread && supervisorctl update

[program:techplay-worker]
command=/usr/bin/php /var/www/techplay/backend/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/techplay/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/techplay/backend/storage/logs/worker.log

; Short jobs only. --max-time recycles it hourly like its sibling, and the
; shorter timeout is a statement about what belongs here: a broadcast that takes
; sixty seconds is a broken broadcast, not a slow one.
[program:techplay-worker-live]
command=/usr/bin/php /var/www/techplay/backend/artisan queue:work --queue=live --sleep=1 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/techplay/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/techplay/backend/storage/logs/worker-live.log
