# Cached game pages — the live block, copied from the server on 17 Aug 2026.
#
# Like nginx-storage-cache.conf, this is written against the real production
# config (`nginx -T`), not against deployment/nginx.conf — that file is a
# historical template and does not match what runs. Two pieces:
#
#   1. proxy_cache_path, in /etc/nginx/conf.d/techplay-cache.conf
#   2. the two location blocks below, in the techplay.gg server block of
#      /etc/nginx/sites-available/techplay, placed after the sitemap location
#      and before `location /`
#
# ── Why ──────────────────────────────────────────────────────────────────────
#
# /games/[slug] is `export const dynamic = "force-dynamic"` on purpose. The
# comment in that file explains it: 114,000 slugs written to disk as ISR files
# is a file count nobody wants to manage, so "Cloudflare CDN caches page
# responses; Next.js writes nothing to disk."
#
# Only the first half was ever built. force-dynamic makes Next send
# `Cache-Control: private, no-cache, no-store`, Cloudflare obeyed it, and the
# result measured on 17 Aug 2026 was:
#
#     curl -I https://techplay.gg/games/evoland
#     cf-cache-status: BYPASS
#
# Every one of 114,000 game pages was rendered from scratch on every request,
# crawler included. nginx now holds them instead — which has the advantage of
# working whether or not the edge is configured, and of being visible to
# whoever runs `nginx -T` rather than living in somebody's dashboard.
#
# ── Why a bounded disk cache rather than ISR ─────────────────────────────────
#
# The original objection to ISR was unbounded growth, and it was correct: an
# ISR directory grows with the catalogue and nothing ever removes an entry.
# proxy_cache has a ceiling and evicts least-recently-used entries when it is
# reached, so the size is a number somebody chose. Measured at ~27 KB per
# cached page (gzip), 4 GB holds roughly 150,000 — the whole catalogue, with
# room left.
#
# ── Why it is safe to share responses between visitors ───────────────────────
#
# Auth on this site lives in localStorage, so the server never learns who is
# asking and every rendered response is already anonymous. Verified: no
# Set-Cookie on any /games/ response. Set-Cookie is hidden regardless, so a
# future one cannot be handed to the wrong person, and a request carrying an
# Authorization header skips the shared store rather than filling it.
#
# RSC navigation is unaffected: Next 16 redirects client-side navigations to
# `?_rsc=<hash>`, so the variant is part of the URL and cannot collide with the
# HTML entry. 307s are not among the cached status codes either way.
#
# ── Measured after ───────────────────────────────────────────────────────────
#
#   40 pages, cold: 3917 ms      warm: 2001 ms, 40/40 X-Cache-Status: HIT
#
# ── Stale content ────────────────────────────────────────────────────────────
#
# An edited game is up to an hour out of date here; nginx has no purge without
# a third-party module, and the Next revalidation webhook does not reach it.
# That was judged acceptable for a catalogue whose rows change rarely. If it
# stops being acceptable, the fix is ngx_cache_purge plus a call from
# CacheRevalidationService, not a shorter TTL.

# ── /etc/nginx/conf.d/techplay-cache.conf ────────────────────────────────────

proxy_cache_path /var/cache/nginx/techplay
                 levels=1:2
                 keys_zone=techplay:100m
                 max_size=4g
                 inactive=24h
                 use_temp_path=off;

# ── inside `server { server_name techplay.gg www.techplay.gg; }` ─────────────

    # The catalogue hub itself, uncached and exact-match.
    #
    # nginx answers /games with a 301 to /games/ as soon as a prefix location
    # ending in a slash exists — which would have sent the hub through a
    # redirect it never used to need, and on to a URL Next then bounces back.
    # An exact-match location outranks the prefix one and keeps /games exactly
    # where it was. It needs no cache of its own: the hub is ISR in Next with a
    # five-minute window.
    location = /games {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ^~ /games/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache techplay;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 410 10m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # The page says no-store because it is rendered fresh every time, which
        # is the thing being fixed here — so its opinion is overridden.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        # A request carrying credentials skips the shared store rather than
        # filling it, even though today it would render identically.
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;

        add_header X-Cache-Status $upstream_cache_status always;
    }

# ── Checking it ──────────────────────────────────────────────────────────────
#
#   curl -sI https://techplay.gg/games/doom | grep -i x-cache-status
#   du -sh /var/cache/nginx/techplay
#
# Emptying it (after a deploy that changes how game pages render):
#
#   find /var/cache/nginx/techplay -type f -delete
