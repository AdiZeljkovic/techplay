# Supervisor Configuration for TechPlay Reverb (WebSocket)
#
# Copy this file to /etc/supervisor/conf.d/techplay-reverb.conf
#
# There was no service file for Reverb. The site opened a socket to
# wss://api-beta.techplay.gg:8080 on every page and every one of them failed;
# nothing was listening, and nothing kept it listening across a reboot.
#
# Two things had to be true for this to work and neither was:
#
#   1. Reverb has to be running and stay running. This file.
#   2. The browser has to be able to reach it. It cannot on 8080 — Cloudflare
#      proxies that port as plaintext HTTP, so a wss:// handshake never
#      completes. nginx now carries /app and /apps through on 443, which is why
#      the bind below is 127.0.0.1: the port is not meant to face the internet.
#
# After copying:
#   supervisorctl reread && supervisorctl update && supervisorctl start techplay-reverb:*

[program:techplay-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/techplay/backend/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/techplay/backend
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/techplay/backend/storage/logs/reverb.log
stopwaitsecs=10
