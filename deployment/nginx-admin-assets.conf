# ── Compiled admin assets, straight off the disk ───────────────────────────
#
# Goes inside the `server { server_name api-beta.techplay.gg; }` block in
# /etc/nginx/sites-available/techplay-backend, **above** `location /`.
#
# Two problems it solves, both measured on 18 Aug 2026:
#
#   1. There was no `location /build/`, so the compiled theme — 607 KB of CSS —
#      was answered by `location /`, which proxies to Octane. Every admin page
#      load spent a PHP worker handing back a stylesheet, or revalidating it.
#      Off the disk it is 8 ms and costs no worker at all.
#
#   2. nginx.conf has `gzip on` but its `gzip_types` line is commented out, so
#      out of the box nginx compresses text/html and nothing else. Serving the
#      file directly without fixing that sent 607 KB where Octane had been
#      sending 63 — faster to fetch, ten times more to download. Compression is
#      declared here rather than globally so it travels with the block that
#      needs it.
#
# Vite content-hashes every filename (theme-D6mJ33lO.css), so the bytes behind
# a given name can never change. A year and `immutable` are safe, and mean the
# browser stops asking after the first visit.

location ^~ /build/ {
    root /var/www/techplay/backend/public;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    try_files $uri =404;
}
