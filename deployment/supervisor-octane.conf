; TechPlay — Octane (FrankenPHP).
;
; Deploy ga sam instalira u /etc/supervisor/conf.d/techplay-octane.conf; ranije
; je ovaj fajl bio samo primjer koji se prepisivao rukom, pa je razisao sa
; stvarnošću: pisalo je 32 workera i 1000 zahtjeva, a mašina vrti 8 i 500.
; Osam je tačan broj — četiri jezgra su, i svaki worker drži svoju PHP memoriju
; i svoju konekciju na bazu.
;
; HOME je ovdje jer FrankenPHP ispod sebe pokreće Caddy, koji bez njega javlja
; "$HOME environment variable is empty" i sprema svoj state u ./caddy pored
; koda. www-data ima /var/www za dom i taj direktorij već postoji.

[program:techplay-octane]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/techplay/backend/artisan octane:start --server=frankenphp --port=8000 --admin-port=2019 --workers=8 --max-requests=500
directory=/var/www/techplay/backend
environment=HOME="/var/www"
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/techplay/backend/storage/logs/octane.log
stopwaitsecs=3600
