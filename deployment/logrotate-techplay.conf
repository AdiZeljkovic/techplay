# TechPlay — sve što piše logove i nije pokriveno paketom.
#
# Jedan fajl, jer su tri odvojena na serveru živjela izvan repoa i niko ih nije
# vidio dok se ne bi pokvarili. Deploy ga instalira kao /etc/logrotate.d/techplay
# i briše stare zasebne fajlove.
#
# `su` u dvije od tri strofe nije kozmetika: /var/log je root:syslog, grupa ima
# pravo pisanja, i logrotate odbija da dira fajl u takvom direktoriju bez
# izričitog korisnika. Odbija ga **tiho** — samo preskoči strofu i nastavi, s
# izlazom 0. Zato /var/log/techplay-backup.log nije bio rotiran nijednom od kad
# je taj config napravljen; otkriveno tek kad je reverb.log dobio istu grešku.

# laravel.log je bio narastao na 1,9 GB bez ičega da ga rotira. LOG_CHANNEL je
# već `daily`, što rotira vlastite fajlove — ali ovaj piše sve što još koristi
# jedinstveni kanal, i raste bez granice.
/var/www/techplay/backend/storage/logs/*.log {
    daily
    rotate 7
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su www-data www-data
}

/var/log/techplay-backup.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
    su root syslog
}

# Supervisor piše ovaj fajl direktno i ništa ga nije rotiralo. Danas je sitan,
# ali WebSocket server koji počne da priča raste bez granice — a ovo je bio
# jedini log na mašini koji nijedan config nije pokrivao.
/var/log/reverb.log {
    weekly
    rotate 6
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root syslog
}
