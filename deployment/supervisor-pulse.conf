# Supervisor Configuration for Laravel Pulse

# Copy this file to /etc/supervisor/conf.d/techplay-pulse.conf
# then:  sudo supervisorctl reread && sudo supervisorctl update

# Pulse has two long-running processes, and it is only half useful without
# either of them.
#
# pulse:work drains the Redis ingest stream into PostgreSQL. Without it — with
# PULSE_INGEST_DRIVER=redis — nothing is ever written and the dashboard stays
# empty; with the default 'storage' driver there is no worker at all and every
# single request pays for its own INSERT instead.
#
# pulse:check takes the server snapshot: CPU, memory, disk. Nothing else records
# it, so without this process the Servers card on the dashboard is blank.
#
# Both cache application code in memory like any daemon, so a deploy must run
# `php artisan pulse:restart` — see deployment/deploy.sh.

[program:techplay-pulse-work]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/techplay/backend/artisan pulse:work
directory=/var/www/techplay/backend
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/techplay/backend/storage/logs/pulse-work.log
stopwaitsecs=20

[program:techplay-pulse-check]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/techplay/backend/artisan pulse:check
directory=/var/www/techplay/backend
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/techplay/backend/storage/logs/pulse-check.log
stopwaitsecs=20
